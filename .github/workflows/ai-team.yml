name: AI Team Orchestrator

# 指定されたIssue番号1件について、coder → qa-engineer → reviewer のループで実装し、PRを作成する。
# reviewer は実際のGitHub PRレビュー(gh pr review --comment。本文にLGTM相当/要修正を明記)を
# 投稿し、coder はそれを読んで同一PR内で修正する。coderとreviewerは同一GitHub App identity
# (claude[bot])で動作するため、GitHubの仕様上 --approve/--request-changes は自分自身のPRに
# 実行できず(`Can not approve your own pull request`)使えない。
# PRのマージは絶対に行わない(必ず人間が手動で行う。llm-practiceリポジトリと同じ方針)。
#
# NOTE: .github/workflows/ 配下のファイルを新規作成・変更するブランチは、通常の
# git push(claude[bot]のGitHub Appインストールトークン)ではGitHub側の仕様で拒否される
# (`refusing to allow a GitHub App to create or update workflow ... without workflows
# permission`)。この場合はcoderが`workflow`権限を持つ専用トークン$WORKFLOW_GH_TOKENで
# pushする(詳細は.claude/agents/coder.md参照)。このトークンが未設定/権限不足の場合も
# 同様に拒否されるので、その旨をPMへの報告に含めるようcoder.mdで指示している。
#
# 対象Issueの選定自体は ai-team-scheduler.yml が1日1回、LLMを使わない決定的なロジックで行い、
# 選定結果をこのworkflow_dispatchの issue_number 入力として渡す(直接この workflow を選定目的で
# 手動実行する場合は、対応したいIssue番号を明示的に指定すること)。
# こうしてトリガー発火時点でIssue番号が確定しているため、run-name にIssue番号を出せる。
#
# NOTE: anthropics/claude-code-action の入力仕様(claude_code_oauth_token など)は
# バージョンによって変わることがあるため、実際に動かす前に以下で最新の入力仕様を確認すること。
# https://github.com/anthropics/claude-code-action
#
# NOTE: 手動実行(workflow_dispatch)でissue_numberに誤って`#3`のように`#`付きで
# 入力されると、プロンプト内で`gh issue comment #3 ...`のようなbashコマンドに
# 埋め込まれた際に`#`以降がシェルのコメント扱いとなり引数が消え、実装が完了しない
# まま黙って終了する障害がllm-practiceリポジトリで実際に発生した。「Sanitize issue
# number input」ステップで数字以外の文字を取り除いてから prompt 内で使うことで、
# この種の入力ミスに対して防御的になっている。

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "実装対象のIssue番号(数字のみ。#は付けないこと。例: 3)"
        required: true
        type: number

run-name: "AI Team Orchestrator: Issue #${{ inputs.issue_number }}"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ai-team-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  pm-orchestrate:
    runs-on: ubuntu-latest
    env:
      # 注意: claude-code-action は内部で GH_TOKEN/GITHUB_TOKEN を
      # 自身のGitHub Appインストールトークン(claude[bot])で上書きするため、
      # ここに直接 GH_TOKEN を設定しても Bash ツール内では効かない。
      # 別名で持たせ、gh project 系コマンドを叩くときだけ明示的に
      # `GH_TOKEN=$PROJECTS_GH_TOKEN gh project ...` のように前置して使う。
      PROJECTS_GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      # .github/workflows/ 配下への変更をpushするために必要な、workflow権限付きトークン
      # (通常のGH_TOKENでは前述のNOTEの通り拒否されるため)。coder.mdの指示で使用する。
      WORKFLOW_GH_TOKEN: ${{ secrets.WORKFLOW_GH_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
      STATUS_IN_PROGRESS_ID: ${{ vars.STATUS_IN_PROGRESS_ID }}
      STATUS_UNDER_REVIEW_ID: ${{ vars.STATUS_UNDER_REVIEW_ID }}
      STATUS_DONE_ID: ${{ vars.STATUS_DONE_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Sanitize issue number input
        id: sanitize
        run: |
          raw="${{ inputs.issue_number }}"
          clean="$(echo "$raw" | tr -dc '0-9')"
          if [ -z "$clean" ]; then
            echo "::error::issue_number must contain a number, got: '$raw'"
            exit 1
          fi
          if [ "$raw" != "$clean" ]; then
            echo "::warning::issue_number '$raw' contained non-digit characters (e.g. a leading '#'); sanitized to '$clean'"
          fi
          echo "issue_number=$clean" >> "$GITHUB_OUTPUT"

      - name: 日本語フォントのインストール(designerのPlaywrightスクリーンショット用)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run PM (lead) agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ai-team-scheduler.yml は `gh workflow run` でこのworkflow_dispatchを起動するため、
          # トリガーの actor は人間ではなく github-actions[bot] になる。claude-code-action は
          # デフォルトでbotによる起動を拒否するため、scheduler経由の自動実行が
          # 「Workflow initiated by non-human actor」で即失敗していた。github-actions を
          # allowed_bots に加えて許可する。
          allowed_bots: "claude,github-actions"
          prompt: |
            あなたはこのチームのPM/リードエンジニアです。今回対応するIssueは #${{ steps.sanitize.outputs.issue_number }} です。
            (Issueの選定自体は ai-team-scheduler.yml が既に済ませているので、選び直す必要はありません)
            以下の手順で実行してください。

            重要: `gh project` で始まるコマンド(item-list, item-add, item-edit など)は
            必ず先頭に `GH_TOKEN=$PROJECTS_GH_TOKEN` を付けて実行すること。
            (通常のGH_TOKENはこのセッション用のbotトークンで、Organization配下の
            Projectを読み書きする権限がないため、専用のPROJECTS_GH_TOKENに
            明示的に差し替える必要がある。issue/PR操作は素の `gh` のままでよい)

            Status更新は毎回このコマンドの `--single-select-option-id` だけを差し替えて実行する:
            `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-edit --project-id $PROJECT_ID --field-id $STATUS_FIELD_ID --id <ITEM_ID> --single-select-option-id <option-id>`

            ## 実装

            0. `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-list $PROJECT_NUMBER --owner $PROJECT_OWNER --format json` で
               この Issue に対応する Project item を探し、ITEM_ID を控える
               (見つからない場合は `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-add $PROJECT_NUMBER --owner $PROJECT_OWNER --url <issue-url>` で追加する)。
            1. Status を In Progress ($STATUS_IN_PROGRESS_ID) に更新する。
            2. 要件を明確化し、実装タスクに分解する。

            **重要な制約(必須)**: 実装・インフラ選定は必ず無料で完結する方法のみを採用すること。
            課金が発生する可能性のある操作(有料クラウドサービスの契約・起動、有料APIの利用等)は
            絶対に実行しない。この制約によって実装できない場合は、実装を行わず、13の手順に従って
            その旨をIssueにコメントし、Status は In Progress のままにして人間の判断を待つこと。

            3. `coder` サブエージェントに実装とブランチ作成を依頼する。
               完了報告を受けたら、`git fetch origin && git branch -r` で対象ブランチが
               実際にリモートへ作成されているか必ず確認する(サブエージェントの報告を鵜呑みにしない)。
               確認できない場合は先に進まず、13の手順に従って状況をIssueにコメントしてから終了する。
            4. `qa-engineer` サブエージェントにテスト作成・実行を依頼する。
            5. テストが失敗した場合は `coder` に修正を依頼し、4に戻る(通るまで繰り返す。この間は In Progress のまま)。
            6. テストが通ったら、ブランチを `git push -u origin <branch>` でリモートに反映し
               (`.github/workflows/` 配下を変更したブランチの場合はcoder.mdの指示に従い
               `$WORKFLOW_GH_TOKEN` を使ったpushになる)、PRを作成する(`gh pr create --title ... --body ...`)。
               PR本文には以下を含める:
                - `Closes #${{ steps.sanitize.outputs.issue_number }}`
                - ## 対応したIssue(番号とリンク)
                - ## 変更内容
               作成後 `gh pr view --json number --jq '.number'` でPR番号を控える(以降reviewer/coderに伝える)。
            7. PRを作成したら、Status を Under Review ($STATUS_UNDER_REVIEW_ID) に更新する。

            ## 実レビュー(reviewer)

            8. `reviewer` サブエージェントに、控えたPR番号を伝えてレビューを依頼する。coderが作成した
               PRの作者とreviewerの実行アカウントは同一GitHub App(claude[bot])のため、GitHubの仕様上
               `gh pr review --approve`/`--request-changes` は自分自身のPRに対して実行できず
               (`GraphQL: Review Can not approve your own pull request`)エラーになる。そのためreviewerは
               常に `gh pr review --comment` で投稿し、本文冒頭に判定(「LGTM相当」または「要修正」)を
               明記する(PMへのテキスト報告だけで終わらせない)。
            9. reviewerが「要修正」と判定した場合は、`coder` にPR番号を伝えて修正を依頼する。coderは
               `gh pr view <PR番号> --json reviews,comments` 等で実際のレビュー内容を確認した上で同じブランチ上で
               修正し、`git push` で反映する。反映後、再度 `reviewer` に同じPR番号でレビューを依頼する
               (このループの間、Statusは Under Review のまま)。

            ## UI/UXレビュー(designer)

            10. `gh pr view <PR番号> --json files --jq '.files[].path'` で変更ファイル一覧を確認し、`app/` または
                `components/` 配下が含まれているか判定する。
                - **含まれていない場合**: designerは呼び出さない(UI変更を伴わないPRにPlaywright起動などの
                  余計なコストをかけないため)。手順12のPR本文には「## UI/UXレビュー」として
                  「対象外(UI関連ファイルの変更なし)」と記載する。
                - **含まれている場合**: `designer` サブエージェントに、控えたPR番号を伝えてUI/UXレビューを
                  依頼する。designerもreviewerと同じ理由で `gh pr review --comment` で判定
                  (「[designer] 判定: LGTM相当」または「[designer] 判定: 要修正」)を投稿する
                  (PMへのテキスト報告だけで終わらせない)。
            11. designerが「要修正」と判定した場合は、`coder` にPR番号を伝えて修正を依頼する。coderの修正後は
                `qa-engineer` に再度テストを依頼し、通過を確認したら `reviewer` と `designer` の両方に同じPR番号で
                再レビューを依頼する(このループの間、Statusは Under Review のまま。**この時点までreviewer/designer
                のどちらか一方でも要修正のままなら、次の手順12には進まないこと**)。
            12. reviewer(該当する場合はdesignerも)の「LGTM相当」判定は、口頭報告ではなく
                `gh pr view <PR番号> --json reviews --jq '.reviews[].body'` の実際の投稿内容で確認する。
                すべて確認できた場合、PR本文に以下の3セクションを追記する:
                - ## 動作確認(エビデンス): qa-engineerが報告した実際のテスト出力をそのまま貼る。
                  `jest`実行など実行コマンドがあるものは、実行した具体的なコマンドも合わせて明記する。
                  実機(iOSシミュレータ・ブラウザ等)の操作による動作確認を行った場合は、
                  その検証フロー(操作手順)を箇条書きで記載した上で結果を示す。
                - ## UI/UXレビュー: designerを呼び出した場合はその判定(LGTM相当/要修正の経緯)と所見の要約、
                  呼び出していない場合は「対象外(UI関連ファイルの変更なし)」と記載する。
                - ## セルフレビューでの気付き: reviewer・designer(呼び出した場合)が実際に投稿したPRレビューを
                  参照する旨と、その中のスコープ外の発見事項を起票したIssue番号があれば記載する
                  (問題が無ければ「特になし」)。
                **ここでPRのマージは絶対に行わない(マージは必ず人間(オーナー)が手動で行う。
                reviewer/designerとcoderが同一identityである以上GitHub側でネイティブなAPPROVE状態を
                作成できないため、人間の実レビューを経ない自動マージは意図的に禁止している)。**
                Status は Under Review のままとし、PR作成後はそれ以上待機せずに終了する。
            13. ターン数の都合などで reviewer(該当する場合はdesignerも)の「LGTM相当」判定に到達できずに
                終了する場合も、絶対にマージしないこと。PRにこれまでの経緯を要約したコメントを残し、
                Status は Under Review のままにして人間の判断を待つ
                (In Progress や Todo に戻さない。PRが開いたまま止まっていることが分かるようにする)。
            14. coder / qa-engineer の報告、および `gh pr view <PR番号> --json reviews --jq '.reviews[].body'` で
                確認できるreviewer・designer(呼び出した場合)の実際のレビュー本文中の「スコープ外の発見事項」に、
                範囲外の問題が含まれていた場合、それぞれについて以下を行う(なければ何もしなくてよい):
                a. `gh issue list --state open` で確認し、既存Issueと内容が重複する場合は新規作成しない。
                b. 重複がなければ `gh issue create --title "<簡潔なタイトル>" --body "<発見内容。どのサブエージェントが何の作業中に気づいたか、元Issue #${{ steps.sanitize.outputs.issue_number }} へのリンクを含める>"` で起票する。
                c. `gh issue edit <新Issue番号> --add-label found-in-review` でラベルを付与する。
                   優先度ラベルは `next` を基本とする(緊急性が本当に高い場合のみ `now`)。
                   `now` を付けた場合、次回の ai-team-scheduler.yml 実行で自動的に選定対象になる点に留意する。
                d. `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-add $PROJECT_NUMBER --owner $PROJECT_OWNER --url <新IssueのURL>`
                   でProjectに追加する(Statusは既定のTodoのままでよい)。
                e. `gh issue comment ${{ steps.sanitize.outputs.issue_number }} --body "関連Issueとして #<新Issue番号> を作成しました"`
            15. 完了条件(PR作成後、reviewer(該当する場合はdesignerも)のレビューが完了しUnder Reviewで人間の判断待ちの状態に
                なっていること。マージはこのワークフローの完了条件に含まれない)に
                到達しないまま、このセッションを終了せざるを得ない場合(ターン数の制約、
                サブエージェントからの応答異常、ツール実行エラー、3の確認でブランチが
                見つからなかった、など理由を問わない)、終了する前に必ず次を実行すること:
                `gh issue comment ${{ steps.sanitize.outputs.issue_number }} --body "<ここまでの作業状況・どの手順まで進んだか・中断した理由(推測でよい)・人間が確認すべき点>"`
                このとき、直前まで設定していた Status(In Progress または Under Review)は
                変更せずそのままにする(Todo や Done には絶対に変更しない)。
            16. 最後に、対応したIssue番号、作成したPRのURL、reviewerのレビュー結果
                (LGTM相当/要修正の経緯と回数)、designerを呼び出した場合はその判定結果、
                新規に起票したIssue(あれば)を日本語でレポートする。

            各サブエージェントは Task tool 経由で呼び出してください。その際は必ず
            `run_in_background: false` を指定し、同期的に(結果が返るまで待って)実行すること。
            もし呼び出した際に「Async agent launched successfully / バックグラウンドで実行中」
            といった応答が返ってきた場合、それは誤ってバックグラウンド実行になってしまった合図です。
            このセッションは1回限りのプロセスなので、後で結果を確認することはできず、そのまま
            セッションを終了すると実行中のサブエージェントの作業は失われます。「完了を待ちます」と
            発言するだけで実際には何もツールを呼ばずにターンを終了することは絶対にしないこと。
            PRのマージは絶対に行わない。reviewer(該当する場合はdesignerも)が「LGTM相当」と判定した場合でも、
            テストが全て通っていたとしても、マージは必ず人間(オーナー)が手動で行う。
            課金が発生する可能性のある操作は絶対に実行しない。
            designerが撮影する比較スクリーンショットは `.designer-screenshots/{before,after}/` に保存すること
            (このステップ以降のワークフロー内で自動的にArtifactsへアップロードされる)。
          claude_args: |
            --max-turns 80 --allowedTools "Bash,Read,Write,Edit,Grep,Glob,Task"

      - name: UI/UXレビューのスクリーンショットをArtifactsへ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designer-screenshots-issue-${{ steps.sanitize.outputs.issue_number }}
          path: .designer-screenshots/
          if-no-files-found: ignore
          retention-days: 14
