name: AI Team Orchestrator

# NOTE: anthropics/claude-code-action の入力仕様(claude_code_oauth_token など)は
# バージョンによって変わることがあるため、実際に動かす前に以下で最新の入力仕様を確認すること。
# https://github.com/anthropics/claude-code-action

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pm-orchestrate:
    if: github.event.label.name == 'ai-auto-dev'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run PM (lead) agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのチームのPM/リードエンジニアです。
            Issue #${{ github.event.issue.number }} を分析し、以下を順番に行ってください。

            1. 要件を明確化し、実装タスクに分解する
            2. coder サブエージェントに実装とブランチ作成を依頼する
            3. qa-engineer サブエージェントにテスト作成・実行を依頼する
            4. テストが失敗した場合は coder に修正を依頼し、3に戻る(通るまで繰り返す)
            5. テストが通ったら reviewer サブエージェントにレビューを依頼する
            6. reviewer が LGTM を出したら、`Closes #${{ github.event.issue.number }}` を含めてPRを作成する
               (`gh pr create --title ... --body ...`)
            7. reviewer が LGTM を出した場合のみ、続けて
               `gh pr merge --squash --delete-branch <PR番号>` を実行しそのままmainへ自動マージする。
               reviewer が LGTM を出さなかった場合は絶対にマージしないこと。
               PRのコメントに reviewer からの指摘を貼り付け、Projectsのステータスを In Review のまま人間の判断を待つ
            8. マージが完了したら、CLAUDE.md の手順に従い Projectsのステータスを Done に更新する
               (マージしなかった場合は 7 の通り In Review のままにする)

            各サブエージェントは Task tool 経由で呼び出してください。
            reviewer の LGTM なしでのマージは、テストが全て通っていたとしても禁止です。
          claude_args: |
            --max-turns 40
