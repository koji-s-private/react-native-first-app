name: Found-in-review Digest

# found-in-review ラベルのIssueのうち、優先度ラベルが `now` でない(=まだ
# ai-team-scheduler.yml の自動選定対象になっていない)ものが未着手のまま
# 溜まっていないか、毎週リマインドするだけのワークフロー。
# 着手の判断・実行は行わない(通知のみ)。`now` を付けたIssueは既に
# スケジューラの選定対象になっているため、このダイジェストの対象からは外す。

on:
  schedule:
    - cron: '0 1 * * 1' # 毎週月曜 10:00 JST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post digest of unaddressed found-in-review issues
        run: |
          set -e

          issues=$(gh issue list --repo "${{ github.repository }}" --label found-in-review --state open \
            --json number,title,createdAt,url,labels \
            --jq '[.[] | select([.labels[].name] | index("now") | not)] | sort_by(.createdAt)')

          count=$(echo "$issues" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No open found-in-review issues awaiting priority triage. Skipping digest comment."
            exit 0
          fi

          roadmap_issue=$(gh issue list --repo "${{ github.repository }}" --label roadmap-thread --state open --json number -q '.[0].number')

          list=$(echo "$issues" | jq -r '.[] | "- #\(.number) \(.title)(作成日: \(.createdAt | split("T")[0]))"')

          header="## 🔔 優先度未確定の found-in-review Issue が ${count} 件あります"
          note="これらはレビュー中に見つかったスコープ外の発見事項です。\`now\`ラベルを付与すると次回の AI Team Scheduler(1日1回)実行で自動的に着手されます。緊急でなければ \`next\`/\`later\` を付けて優先度だけ明示してください(未設定のままだとスケジューラの選定対象になりません)。"
          body=$(printf '%s\n\n%s\n\n%s\n' "$header" "$note" "$list")

          gh issue comment "$roadmap_issue" --repo "${{ github.repository }}" --body "$body"
