name: CI

# PR作成・更新時にlint・テスト・依存パッケージの脆弱性検知を実行する。
# READMEに記載のNode.js v22系を使用する(厳密なバージョン管理はIssue #20で別途扱う)。

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Lint(ESLint)
        run: npm run lint

      - name: テスト(Jest)
        run: npm test

      - name: 依存パッケージの脆弱性検知(npm audit)
        run: npm audit --audit-level=high
