name: CI

# PR作成・更新時にlint・フォーマットチェック・テスト・依存パッケージの脆弱性検知を実行する。
# .nvmrc に記載のNode.jsバージョンを使用する。

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Lint(ESLint)
        run: npm run lint

      - name: フォーマットチェック(Prettier)
        run: npm run format:check

      - name: テスト(Jest)
        run: npm test

      - name: 依存パッケージの脆弱性検知(npm audit)
        run: npm audit --audit-level=high
