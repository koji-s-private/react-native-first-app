name: CodeQL Analysis

# GitHub標準のCodeQLによる静的セキュリティ解析。JavaScript/TypeScriptを対象とし、
# PR時・mainへのpush時・週次スケジュールで実行する。結果はSecurityタブに反映される。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # 毎週月曜 3:00 UTC(12:00 JST)に実行
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - name: CodeQLの初期化
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: CodeQL解析の実行
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
